services:
  influxdb:
    image: influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      - INFLUXDB_DB=your_database_name
      - INFLUXDB_ORG=Home
    volumes:
      - ./influxdb/data:/var/lib/influxdb2:rw
      - ./influxdb/config/config.yaml:/etc/influxdb2/config.yaml:ro

  grafana:
    image: grafana/grafana
    restart: unless-stopped
    user: ${USER_UID}:1000
    environment:
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
    volumes:
      - ./grafana/config:/etc/grafana/provisioning/datasources:ro
      - ./grafana/data:/var/lib/grafana:rw
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:rw
    depends_on:
      - influxdb

  mqtt-broker:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/config/passwd:/mosquitto/config/passwd:rw

  telegraf:
    image: telegraf:latest
    restart: unless-stopped
    environment:
      - INFLUXDB_HOST=${INFLUXDB_HOST}
      - INFLUXDB_PORT=${INFLUXDB_PORT}
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
      - MQTT_USERNAME=${MQTT_USERNAME}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      - MQTT_HOST=${MQTT_HOST}
      - MQTT_PORT=${MQTT_PORT}
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    depends_on:
      - influxdb
      - mqtt-broker

  mqtt-explorer:
    image: smeagolworms4/mqtt-explorer
    restart: unless-stopped
    user: ${USER_UID}:1000
    volumes:
      - ./mqtt-explorer/config:/mqtt-explorer/config:rw
    depends_on:
      - mqtt-broker

  trigger:
    build: python-apps
    command: python trigger.py
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./python-apps/src:/app:ro
    depends_on:
      - mqtt-broker

  pseudo-mqtt-sensor:
    build: python-apps
    command: python pseudo-sensor.py
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./python-apps/src:/app:ro
    depends_on:
      - mqtt-broker
      - trigger

  nginx-proxy:
    image: nginx:latest
    restart: unless-stopped
    ports:
      - 80:80
    volumes:
      - ./nginx-proxy/config.conf:/etc/nginx/nginx.conf:ro
